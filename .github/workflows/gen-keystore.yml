name: Generate signing keystore (one-shot)

on: workflow_dispatch

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore musify-release.jks \
            -alias musify \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "Musify#2026#Nkta" \
            -keypass "Musify#2026#Nkta" \
            -dname "CN=Nicolas Koudota, OU=Dev, O=NKTA, L=Nantes, ST=Pays de la Loire, C=FR"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: musify-release-keystore
          path: musify-release.jks
